name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: flipCardVisual

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: flipCardVisual/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser visual tests
        run: npm run test:visual

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            flipCardVisual/playwright-report
            flipCardVisual/test-results
          if-no-files-found: ignore

      - name: Build production resources
        run: npm run build:prod

      - name: Package visual
        run: npm run package

      - name: Upload Power BI visual
        uses: actions/upload-artifact@v4
        with:
          name: smart-kpi-flip-card
          path: flipCardVisual/dist/*.pbiviz
          if-no-files-found: error
